@if (initialPhrases().length === 0) {
  <div class="flex-1 flex items-center justify-center p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom))] md:pb-6">
    <div class="w-full max-w-md text-center">
      <ui-empty-state
        icon="✓"
        title="Nenhuma revisada vencida"
        description="Volte para a biblioteca ou gere novas frases." />
      <div class="mt-4 flex gap-3">
        <ui-button variant="secondary" [fullWidth]="true" (clicked)="handleBack()">Voltar</ui-button>
        <ui-button variant="primary" [fullWidth]="true" (clicked)="handleGenerate()">Gerar</ui-button>
      </div>
    </div>
  </div>
} @else {
  <app-study-screen
    [initialPhrases]="initialPhrases()"
    (back)="handleBack()"
    (finish)="handleFinish()" />
}
