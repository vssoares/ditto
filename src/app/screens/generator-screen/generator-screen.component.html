<div class="flex-1 overflow-y-auto p-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] sm:p-6 sm:pb-6 animate-fade-up">
  <div class="max-w-2xl mx-auto space-y-6 sm:space-y-8">

    <div class="text-center pt-2 sm:pt-4">
      <h1 class="font-display text-3xl sm:text-4xl text-chalk mb-2">
        Gerar <span class="text-amber-400 italic">Frases</span>
      </h1>
      <p class="text-chalk/40 font-mono text-xs tracking-wider uppercase">
        Powered by Vaqueiro · Ditto
      </p>
    </div>

    <div>
      <ui-label className="mb-3">Tópico</ui-label>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        @for (t of topics; track t.id) {
          <ui-select-option
            layout="card"
            [fullWidth]="true"
            [icon]="t.icon"
            [label]="t.label"
            [isSelected]="!customTopic() && topic() === t.id"
            (selected)="selectTopic(t.id)" />
        }
      </div>
      <div class="mt-3 relative">
        <ui-text-input
          [value]="customTopic()"
          (valueChange)="onCustomTopicChange($event)"
          placeholder="Ou digite um tópico personalizado..."
          [disabled]="loading()" />
        @if (customTopic()) {
          <span class="pointer-events-none absolute right-4 top-[46px] -translate-y-1/2 font-mono text-[10px] text-chalk/25">
            {{ customTopic().length }}/50
          </span>
        }
      </div>
    </div>

    <div>
      <ui-label className="mb-3">Nível</ui-label>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        @for (l of levels; track l.id) {
          <ui-select-option
            layout="pill"
            [fullWidth]="true"
            [label]="l.label"
            [sublabel]="l.desc"
            [isSelected]="level() === l.id"
            (selected)="level.set(l.id)" />
        }
      </div>
    </div>

    <div>
      <ui-label className="mb-3">Quantidade de frases</ui-label>
      <div class="grid grid-cols-4 gap-2 sm:flex sm:gap-2">
        @for (c of counts; track c) {
          <ui-select-option
            [label]="'' + c"
            [isSelected]="count() === c"
            (selected)="count.set(c)"
            className="w-full sm:w-14 h-10 py-0! px-0! justify-center items-center flex" />
        }
      </div>
    </div>

    <ui-error-banner [message]="error()" />

    <ui-button [fullWidth]="true" size="lg" [loading]="loading()" (clicked)="handleGenerate()">
      {{ loading() ? 'Gerando frases...' : 'Gerar Frases →' }}
    </ui-button>
  </div>
</div>
