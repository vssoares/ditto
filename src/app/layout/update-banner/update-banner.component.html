@if (visible()) {
  <div class="relative z-50 flex items-center justify-between px-4 py-2 bg-amber-500/10 border-b border-amber-500/20 text-xs text-amber-400/90">
    @switch (state().status) {
      @case ('available') {
        <span>Nova versão disponível: <strong>{{ asAvailable(state()).version }}</strong></span>
        <button
          (click)="electron.downloadUpdate()"
          class="ml-4 px-3 py-1 rounded bg-amber-500/20 hover:bg-amber-500/30 transition-colors font-mono">
          Baixar
        </button>
      }
      @case ('downloading') {
        <span>Baixando atualização...</span>
        <span class="font-mono">{{ asDownloading(state()).percent }}%</span>
      }
      @case ('downloaded') {
        <span>Atualização pronta para instalar</span>
        <button
          (click)="electron.installUpdate()"
          class="ml-4 px-3 py-1 rounded bg-amber-500/20 hover:bg-amber-500/30 transition-colors font-mono">
          Reiniciar e instalar
        </button>
      }
    }
  </div>
}
